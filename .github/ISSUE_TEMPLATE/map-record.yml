name: Map screenshot or record
description: Add a screenshot or a record time to a map page (replays as links only)
labels: [map-record]
title: "[Map] <map name>"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for contributing! Entries are added to the map page by a maintainer.
        Paste links (ManiaExchange, YouTube/Twitch clips, Discord, file hosts) **or attach files** — drag a `.replay.gbx` replay or a screenshot into any field below; GitHub hosts the attachment. Videos stay as links and play inline; do not upload video files.
  - type: input
    id: map-name
    attributes:
      label: Map name
      description: Exact in-game name. If the map has no page yet, say so — we will create one.
      placeholder: e.g. HuntersArena example map
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What are you adding?
      options:
        - Screenshot
        - Record time
        - Both
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Game mode
      options:
        - Pursuit
        - Goal Hunt
        - Goal Hunt Pursuit
        - Hunters
        - Pursuit SWAP
    validations:
      required: false
  - type: input
    id: player
    attributes:
      label: Player name
      description: Who drove the run / took the screenshot.
      placeholder: Nickname
    validations:
      required: false
  - type: input
    id: time
    attributes:
      label: Record time
      description: "Format m:ss.mmm — for example 0:42.123. Leave empty for screenshots."
      placeholder: 0:42.123
    validations:
      required: false
  - type: input
    id: date
    attributes:
      label: Date
      description: When the run or screenshot happened (YYYY-MM-DD).
      placeholder: "2026-11-19"
    validations:
      required: false
  - type: textarea
    id: screenshot-links
    attributes:
      label: Screenshot links
      description: Image URLs (ManiaExchange, Imgur, Discord CDN) or drag screenshots into this field to attach them. One per line, optional caption after a comma.
      placeholder: |
        https://... , start area from the thief spawn
    validations:
      required: false
  - type: textarea
    id: replay-links
    attributes:
      label: Replay link
      description: ManiaExchange replay page or a file-host link — or drag the .replay.gbx file into this field to attach it.
      placeholder: https://tm.mania.exchange/replays/...
    validations:
      required: false
  - type: textarea
    id: clip-links
    attributes:
      label: Video / clip link
      description: Link only — videos are embedded, never uploaded. YouTube, Twitch, Medal.tv, Streamable, Discord (cdn.discordapp.com / media.discordapp.net), Google Drive, Dropbox, MEGA or any direct .mp4/.webm URL. A clip is enough to verify a record.
      placeholder: https://cdn.discordapp.com/attachments/.../run.mp4 or https://youtu.be/...
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Vehicle used, shortcuts, zone usage, or anything else worth documenting.
    validations:
      required: false
  - type: checkboxes
    id: terms
    attributes:
      label: Confirmation
      options:
        - label: I understand that submitted content is published under CC BY-SA 4.0 and that replays are linked, not uploaded.
          required: true
