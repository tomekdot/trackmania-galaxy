name: Map history or memory
description: Add a timestamped event or a community memory to a map page
labels: [map-history]
title: "[Map history] <map name>"
body:
  - type: markdown
    attributes:
      value: |
        Tell us what happened on this map: a notable match, a record run, a map update,
        a community moment — or a memory/meme worth keeping. Entries are published with
        their date, so the map page becomes a timeline.
  - type: input
    id: map-name
    attributes:
      label: Map name
      description: Exact in-game name.
      placeholder: e.g. Pursuit - Canyon City
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What are you adding?
      options:
        - Event (something that happened)
        - Memory / meme
        - Both
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: Date
      description: When it happened (YYYY-MM-DD). Approximate dates are fine — say so in the text.
      placeholder: "2026-11-19"
    validations:
      required: false
  - type: textarea
    id: story
    attributes:
      label: What happened / the memory
      description: A short description. For events, say what changed or what happened on the map.
      placeholder: e.g. First 100-point match on this map; the thief camped in the Police Zone for 3 minutes...
    validations:
      required: true
  - type: input
    id: people
    attributes:
      label: Who was involved
      description: Player nicknames, mapper, or "community".
      placeholder: Nicknames
    validations:
      required: false
  - type: textarea
    id: links
    attributes:
      label: Links, screenshots, clips, memes
      description: URLs or drag files into this field (screenshots, meme images). Video links (Discord, YouTube, Medal.tv, Google Drive, Dropbox, MEGA, direct .mp4/.webm) play inline — paste the link, do not upload the video file. One per line, optional caption after a comma.
      placeholder: |
        https://... , the winning capture
    validations:
      required: false
  - type: checkboxes
    id: terms
    attributes:
      label: Confirmation
      options:
        - label: I understand this is published under CC BY-SA 4.0 and that other players may be named.
          required: true
